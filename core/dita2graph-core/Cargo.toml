[package]
name = "dita2graph-core"
description = "Normalizes DITA-OT's resolved model into an OKF v0.2 knowledge bundle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dita2graph_core"
path = "src/lib.rs"

[[bin]]
name = "dita2graph-core"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
clap.workspace = true
chrono.workspace = true
okf-validator.workspace = true
ort.workspace = true
tokenizers.workspace = true
rusqlite.workspace = true
# The build-time SHACL check of the RDF export (src/shacl.rs).
oxigraph.workspace = true
regex.workspace = true

[dev-dependencies]
# Parses the RDF export back in tests (src/rdf.rs); the export itself is
# hand-written Turtle and needs no RDF library.
oxttl = "0.2"
tempfile = "3"
toml.workspace = true

name: Integration

# Runs the full, real pipeline end to end: Rust core engine, Java
# extraction plugin, then a live DITA-OT 4.4 via gradle-build/. Separate
# from rust.yml/java.yml (which only build+unit-test each side in
# isolation) since this downloads a real ~80MB DITA-OT release and takes
# noticeably longer -- docs/plugin-specification.md §12 Phase 4's exit
# criterion made durable, not just a one-off manual verification
# (docs/dev/phase-0-findings.md findings 4-7).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # matches plugin/org.dita.dita2graph/java/build.gradle.kts's --release 21

      - name: Build dita2graph-core (release)
        run: cargo build --release -p dita2graph-core --locked

      - name: Build lib/dita2graph-core.jar
        working-directory: plugin/org.dita.dita2graph/java
        run: ./gradlew jar --no-daemon

      - name: Run the full pipeline against sample-docs/
        working-directory: gradle-build
        env:
          DITA2GRAPH_CORE_BIN: ${{ github.workspace }}/target/release/dita2graph-core
        run: ./gradlew buildKnowledgeGraph --no-daemon

      - name: Validate the generated bundle
        run: ./target/release/dita2graph-core validate --bundle gradle-build/build/dita2graph/okf

      - name: Confirm the generated bundle looks right
        run: |
          set -euo pipefail
          test -f gradle-build/build/dita2graph/okf/topics/installing-product.md
          grep -q 'relations:' gradle-build/build/dita2graph/okf/topics/installing-product.md
          grep -q '^  - configuration$' gradle-build/build/dita2graph/okf/topics/installing-product.md

      - name: Confirm the RAG index looks right (§13.1)
        run: |
          set -euo pipefail
          test -f gradle-build/build/dita2graph/rag/chunks.jsonl
          test -f gradle-build/build/dita2graph/rag/metadata.json
          # one chunk line per topic in sample-docs/ (installing-product,
          # configuration, installing-product-prereqs, internal-notes)
          test "$(wc -l < gradle-build/build/dita2graph/rag/chunks.jsonl)" -eq 4
          grep -q '"id":"installing-product"' gradle-build/build/dita2graph/rag/chunks.jsonl
          grep -q '"okfNode":"topics/installing-product.md"' gradle-build/build/dita2graph/rag/chunks.jsonl

      - name: Build the public/internal DITAVAL split (§6.1)
        working-directory: gradle-build
        env:
          DITA2GRAPH_CORE_BIN: ${{ github.workspace }}/target/release/dita2graph-core
        run: ./gradlew buildKnowledgeGraphPublic buildKnowledgeGraphInternal --no-daemon

      - name: Confirm internal-only content is excluded from the public bundle only
        run: |
          set -euo pipefail
          if [ -f gradle-build/build/dita2graph-public/okf/topics/internal-notes.md ]; then
            echo "::error::internal-notes.md leaked into the public DITAVAL bundle"
            exit 1
          fi
          test -f gradle-build/build/dita2graph-internal/okf/topics/internal-notes.md
          # The DITAVAL split (§6.1) applies before dita2graph:extract ever
          # runs on the excluded topic, so it's equally absent from the
          # RAG index, not just the OKF graph (§13.1's "single pass, two
          # correlated outputs" -- one filtered input, both outputs agree).
          if grep -q '"id":"internal-notes"' gradle-build/build/dita2graph-public/rag/chunks.jsonl; then
            echo "::error::internal-notes leaked into the public DITAVAL rag/chunks.jsonl"
            exit 1
          fi
          grep -q '"id":"internal-notes"' gradle-build/build/dita2graph-internal/rag/chunks.jsonl

      - name: Confirm DITA-OT's validation gate rejects broken content
        working-directory: gradle-build
        run: |
          if ./gradlew validateBrokenDoc --no-daemon; then
            echo "::error::validateBrokenDoc was expected to fail (sample-docs-invalid/ has an unresolvable href) but succeeded"
            exit 1
          fi
          echo "validateBrokenDoc failed as expected -- the validation gate works"

name: Java

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Any JDK 17+ builds the jar: build.gradle.kts compiles it at
          # --release 17, the Java DITA-OT 4.x runs on (§1.1).
          java-version: "21"
      - name: gradlew test jar
        working-directory: plugin/io.github.jyjeanne.dita2graph/java
        run: ./gradlew test jar --no-daemon

name: Java

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 21, not the spec's Java 25 floor (docs/plugin-specification.md
          # §1.1): matches plugin/org.dita.dita2graph/java/build.gradle.kts's
          # own --release 21, chosen because JDK 25 wasn't available where
          # this was first built and tested (see that project's README).
          # Bump both together once a real JDK 25 is available.
          java-version: "21"
      - name: gradlew test jar
        working-directory: plugin/org.dita.dita2graph/java
        run: ./gradlew test jar --no-daemon

name: Tag release

# Manually creates and pushes an annotated vX.Y.Z tag from main, then
# explicitly dispatches release.yml (build + publish a GitHub Release).
# Kept as its own workflow_dispatch step, separate from release.yml, so
# a maintainer can trigger tagging from the Actions UI without needing
# local tag-push access -- v0.1.0 itself had to be tagged and pushed
# manually because this session's own git remote is restricted to
# branch updates only (a session-level policy, not a GitHub permission
# -- the GITHUB_TOKEN this workflow runs with isn't subject to it).
#
# The explicit dispatch at the end matters: this job pushes the tag
# using the default GITHUB_TOKEN, and GitHub does not let a
# GITHUB_TOKEN-authored push trigger *other* workflow runs (recursion
# guard), so release.yml's `on: push: tags` never fires on its own here
# -- confirmed against v0.1.0, which never triggered a release.yml run.
# workflow_dispatch is exempt from that restriction, so this workflow
# calls it directly once the tag is pushed -- passing the tag as an
# explicit `tag` input rather than `--ref`, since `--ref` only selects
# which copy of the workflow *file* to run, not what release.yml checks
# out or releases (a manual UI dispatch left on the "main" branch was
# seen building/releasing "main" itself and failing at `gh release
# create` because no such tag existed).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, with or without the leading v (e.g. 0.2.0 or v0.2.0)"
        required: true
      message:
        description: "Tag annotation message (optional; defaults to \"vX.Y.Z\")"
        required: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main (it was triggered from ${{ github.ref }}) -- release tags should only ever point at main."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Accept the version input with or without a leading v/V -- the
      # field's description asks for it bare, but a v0.1.1-shaped entry
      # (matching how the tag itself reads) is exactly as easy to type,
      # and previously failed validation outright instead of just being
      # normalized. VERSION is always bare here on; TAG always has the v.
      - name: Normalize the version input
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Validate version format
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be X.Y.Z or X.Y.Z-prerelease, optionally prefixed with v (got '${{ inputs.version }}')"
            exit 1
          fi

      # Cargo.toml's [workspace.package].version is the one place this
      # repo's own version is declared (core/dita2graph-core and
      # mcp/dita2graph-mcp both inherit it via version.workspace = true);
      # catching a mismatch here beats discovering it after the tag and
      # release already exist.
      - name: Confirm Cargo.toml's workspace version matches
        run: |
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::Cargo.toml's [workspace.package].version ($cargo_version) doesn't match the requested tag $TAG. Bump it, merge that to main, then re-run this workflow."
            exit 1
          fi

      - name: Reject an already-existing tag
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists."
            exit 1
          fi

      - name: Create and push the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MESSAGE="${{ inputs.message }}"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="$TAG"
          fi
          git tag -a "$TAG" -m "$MESSAGE"
          git push origin "$TAG"

      - name: Dispatch the release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref main -f tag="$TAG"

name: Tag release

# Manually creates and pushes an annotated vX.Y.Z tag from main, which
# then triggers release.yml (build + publish a GitHub Release). Kept as
# its own workflow_dispatch step, separate from release.yml, so a
# maintainer can trigger tagging from the Actions UI without needing
# local tag-push access -- v0.1.0 itself had to be tagged and pushed
# manually because this session's own git remote is restricted to
# branch updates only (a session-level policy, not a GitHub permission
# -- the GITHUB_TOKEN this workflow runs with isn't subject to it).
# Future releases can go through here instead.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, without the leading v (e.g. 0.2.0)"
        required: true
      message:
        description: "Tag annotation message (optional; defaults to \"vX.Y.Z\")"
        required: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main (it was triggered from ${{ github.ref }}) -- release tags should only ever point at main."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be X.Y.Z or X.Y.Z-prerelease (got '${{ inputs.version }}')"
            exit 1
          fi

      # Cargo.toml's [workspace.package].version is the one place this
      # repo's own version is declared (core/dita2graph-core and
      # mcp/dita2graph-mcp both inherit it via version.workspace = true);
      # catching a mismatch here beats discovering it after the tag and
      # release already exist.
      - name: Confirm Cargo.toml's workspace version matches
        run: |
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$cargo_version" != "${{ inputs.version }}" ]; then
            echo "::error::Cargo.toml's [workspace.package].version ($cargo_version) doesn't match the requested tag v${{ inputs.version }}. Bump it, merge that to main, then re-run this workflow."
            exit 1
          fi

      - name: Reject an already-existing tag
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::v${{ inputs.version }} already exists."
            exit 1
          fi

      - name: Create and push the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          MESSAGE="${{ inputs.message }}"
          if [ -z "$MESSAGE" ]; then
            MESSAGE="v${{ inputs.version }}"
          fi
          git tag -a "v${{ inputs.version }}" -m "$MESSAGE"
          git push origin "v${{ inputs.version }}"

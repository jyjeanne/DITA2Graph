name: Release

# Builds and publishes a GitHub Release whenever a vX.Y.Z tag lands --
# pushed either by tag.yml's workflow_dispatch, or directly by a
# maintainer with local tag-push access. Re-runs the same checks
# rust.yml/java.yml already gate every push with, as a release-blocking
# safety net, before building or publishing anything.

on:
  push:
    tags:
      - "v*.*.*"
  # tag.yml pushes the tag using the default GITHUB_TOKEN, and GitHub
  # deliberately does not let a GITHUB_TOKEN-authored push trigger other
  # workflow runs (it would create recursive workflow chains). That
  # exemption list has exactly two entries: workflow_dispatch and
  # repository_dispatch. So tag.yml calls `gh workflow run release.yml
  # -f tag=vX.Y.Z` right after pushing the tag, which lands here instead
  # of on the (silently suppressed) push event. A maintainer with local
  # tag-push access still triggers this the "normal" way via `push`.
  #
  # `tag` is required (not defaulted from github.ref_name) because a
  # manual "Run workflow" from the Actions UI runs against whatever
  # branch is selected there -- usually main -- and this workflow has no
  # way to force that selector onto a tag. Trusting ref_name in that case
  # silently built a "main" release and failed at `gh release create`
  # with "tag main doesn't exist". Requiring an explicit tag input and
  # validating it below closes that off for every trigger path.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, with or without the leading v (e.g. v0.2.0 or 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate the release tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Accept the tag input with or without a leading v/V --
            # the field asks for "vX.Y.Z" but a bare "X.Y.Z" is just
            # as easy to type, and previously failed validation
            # outright instead of just being normalized.
            TAG="${{ inputs.tag }}"
            TAG="${TAG#v}"
            TAG="${TAG#V}"
            TAG="v$TAG"
          else
            TAG="${{ github.ref_name }}"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' isn't a vX.Y.Z tag."
            exit 1
          fi
          if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG doesn't exist in this repo -- create/push it first (e.g. via tag.yml) before releasing it."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: cargo test --workspace
        run: cargo test --workspace --locked
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: gradlew test
        working-directory: plugin/io.github.jyjeanne.dita2graph/java
        run: ./gradlew test --no-daemon

  # The plugin ZIP with a dita2graph-core build per platform, installed
  # and run in a stock DITA-OT on Linux, macOS and Windows first.
  package:
    needs: [resolve-tag, test]
    uses: ./.github/workflows/package.yml
    with:
      ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}

  release:
    needs: [resolve-tag, package]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve-tag.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: plugin-zip

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: binaries
          merge-multiple: true

      # The registry names a plugin version's ZIP by its URL and its
      # SHA-256 (https://www.dita-ot.org/dev/topics/plugins-registry.html),
      # so the ZIP is published under a name that never changes.
      - name: Package release artifacts
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          ZIP="io.github.jyjeanne.dita2graph-${VERSION}.zip"
          mkdir -p dist
          cp plugin-zip/io.github.jyjeanne.dita2graph.zip "dist/$ZIP"
          (cd dist && sha256sum "$ZIP" > "$ZIP.sha256")
          for dir in binaries/*/; do
            platform=$(basename "$dir")
            for bin in dita2graph-core dita2graph-mcp; do
              if [[ "$platform" == windows-* ]]; then
                (cd "$dir" && zip -q "$GITHUB_WORKSPACE/dist/$bin-${RELEASE_TAG}-$platform.zip" "$bin.exe")
              else
                chmod +x "$dir$bin"
                tar -czf "dist/$bin-${RELEASE_TAG}-$platform.tar.gz" -C "$dir" "$bin"
              fi
            done
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          ls -l dist

      # This version's entry of io.github.jyjeanne.dita2graph.json, with
      # the URL and the checksum of the ZIP above: what a pull request to
      # https://github.com/dita-ot/registry adds (docs/dev/releasing.md).
      - name: Write the DITA-OT registry entry
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${ZIP}"
          CKSUM=$(cut -d' ' -f1 "dist/$ZIP.sha256")
          jq --arg vers "$VERSION" --arg url "$URL" --arg cksum "$CKSUM"             '[.[] | select(.vers == $vers) | . + {url: $url, cksum: $cksum}]'             io.github.jyjeanne.dita2graph.json > dist/io.github.jyjeanne.dita2graph.json
          if [ "$(jq length dist/io.github.jyjeanne.dita2graph.json)" != 1 ]; then
            echo "::error::io.github.jyjeanne.dita2graph.json has no entry for $VERSION"
            exit 1
          fi
          {
            echo "### DITA-OT registry entry"
            echo
            echo "Add this to io.github.jyjeanne.dita2graph.json in a fork of https://github.com/dita-ot/registry:"
            echo
            echo '```json'
            cat dist/io.github.jyjeanne.dita2graph.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A version with a "-" suffix (e.g. v0.2.0-beta.1) publishes as
          # a prerelease; a plain vX.Y.Z does not.
          PRERELEASE_FLAG=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            PRERELEASE_FLAG=(--prerelease)
          fi
          gh release create "$RELEASE_TAG"             dist/*             --title "$RELEASE_TAG"             --generate-notes             --verify-tag             "${PRERELEASE_FLAG[@]}"

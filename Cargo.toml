[workspace]
resolver = "2"
members = [
    "core/dita2graph-core",
    "mcp/dita2graph-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jyjeanne/DITA2Graph"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
okf-validator = { git = "https://github.com/jyjeanne/okf-rs" }
